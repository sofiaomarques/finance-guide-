<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Saldo</title>
  <meta name="theme-color" content="#f4f1e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171912" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&text=Saldo&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <section id="auth" class="auth" hidden>
    <div class="auth-caixa">
      <h1 class="logo">Saldo</h1>
      <div class="auth-abas" role="tablist">
        <button type="button" role="tab" data-modo="login" aria-selected="true">Entrar</button>
        <button type="button" role="tab" data-modo="cadastro" aria-selected="false">Criar conta</button>
      </div>
      <p id="auth-dica" class="auth-dica" hidden></p>
      <form id="auth-form" novalidate>
        <label class="campo" id="campo-nome" hidden>Nome
          <input id="auth-nome" type="text" autocomplete="name" maxlength="80">
        </label>
        <label class="campo" id="campo-email">E-mail
          <input id="auth-email" type="email" autocomplete="email" inputmode="email" required>
        </label>
        <label class="campo" id="campo-senha"><span id="rotulo-senha">Senha</span>
          <input id="auth-senha" type="password" autocomplete="current-password" minlength="8" required>
        </label>
        <p id="auth-erro" class="auth-erro" role="alert" hidden></p>
        <p id="auth-info" class="auth-info" role="status" hidden></p>
        <button type="submit" id="auth-btn">Entrar</button>
        <button type="button" id="auth-link" class="auth-link">Esqueci minha senha</button>
      </form>
    </div>
  </section>

  <div id="app" hidden>
  <header class="barra-app">
    <span class="marca logo">Saldo</span>
    <div class="conta">
      <span id="conta-nome"></span>
      <button id="sair" type="button">Sair</button>
    </div>
  </header>

  <section class="lancar" aria-label="Novo lançamento">
    <form id="form" autocomplete="off">
      <div class="tipo-abas" role="radiogroup" aria-label="Tipo de lançamento">
        <button type="button" role="radio" data-tipo="gasto" aria-checked="true">Gasto</button>
        <button type="button" role="radio" data-tipo="ganho" aria-checked="false">Ganho</button>
      </div>
      <label class="linha-valor">
        <span class="rs">R$</span>
        <input id="valor" type="text" inputmode="decimal" placeholder="0,00  ou  45 mercado" enterkeyhint="done" aria-label="Valor do gasto" autofocus>
      </label>
      <input id="descricao" type="text" placeholder="Descrição (opcional)" maxlength="200" aria-label="Descrição">
      <label class="data-label">
        <span class="data-rot">Data</span>
        <span id="data-txt">Hoje</span>
        <input id="data" type="date" aria-label="Data do lançamento">
      </label>
      <button type="submit" id="btn-add">Adicionar</button>
      <div id="chips" class="chips" role="radiogroup" aria-label="Categoria"></div>
    </form>
  </section>

  <main>
    <div class="navegacao">
      <div class="vista-abas" role="tablist" aria-label="Telas">
        <button type="button" role="tab" id="aba-painel" data-vista="painel" aria-controls="vista-painel" aria-selected="true">Painel</button>
        <button type="button" role="tab" id="aba-mes" data-vista="mes" aria-controls="vista-mes" aria-selected="false">Meu mês</button>
      </div>
      <nav class="mes-nav" aria-label="Mês">
        <button id="mes-ant" aria-label="Mês anterior">‹</button>
        <h1 id="mes-titulo">—</h1>
        <button id="mes-prox" aria-label="Próximo mês">›</button>
      </nav>
    </div>

    <div id="vista-mes" class="vista" role="tabpanel" aria-labelledby="aba-mes" hidden>
      <section id="balanco" class="resumo balanco"></section>

      <section class="secao">
        <div class="lanc-topo">
          <h2>Movimentações</h2>
          <div id="mes-filtro" class="seg" role="radiogroup" aria-label="Mostrar">
            <button type="button" role="radio" data-filtro="" aria-checked="true">Todos</button>
            <button type="button" role="radio" data-filtro="gasto" aria-checked="false">Gastos</button>
            <button type="button" role="radio" data-filtro="ganho" aria-checked="false">Ganhos</button>
          </div>
        </div>
        <p id="mes-subtotal" class="subtotal"></p>
        <div id="mes-lista"></div>
      </section>
    </div>

    <div id="vista-painel" class="vista" role="tabpanel" aria-labelledby="aba-painel">
      <section class="resumo" id="cards" aria-label="Resumo do mês"></section>

      <div class="analise">
        <section class="secao">
          <h2>Gastos por categoria</h2>
          <div class="rosca-wrap">
            <div id="rosca" class="rosca"></div>
            <ul id="legenda" class="legenda"></ul>
          </div>
        </section>

        <section class="secao">
          <h2>Gasto por dia</h2>
          <div id="dias"></div>
        </section>
      </div>

      <section class="secao" id="painel-ganhos" hidden>
        <h2>De onde veio o dinheiro</h2>
        <ul id="legenda-ganhos" class="legenda"></ul>
      </section>

      <section class="secao">
        <div class="lanc-topo">
          <h2>Lançamentos</h2>
          <select id="filtro" aria-label="Filtrar lançamentos"></select>
        </div>
        <ul id="lista" class="lista"></ul>
      </section>
    </div>
  </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
